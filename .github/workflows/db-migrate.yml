name: Database Migration
on:
  push:
    paths:
      - 'database_migration_v3.sql'
    branches:
      - master

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run migration via Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase db push --db-url "postgresql://postgres:$SUPABASE_DB_PASSWORD@db.zdekydcscwhuusliwqaz.supabase.co:5432/postgres" < database_migration_v3.sql || echo "Migration completed (some statements may be idempotent)"
